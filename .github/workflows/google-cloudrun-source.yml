# Test_nyc_evictions_data
# This workflow will deploy source code on Cloud Run when a commit is pushed to
# the "main" branch.
#
# To configure this workflow:
#
# 1. Enable the following Google Cloud APIs:
#
#    - Artifact Registry (artifactregistry.googleapis.com)
#    - Cloud Build (cloudbuild.googleapis.com)
#    - Cloud Run (run.googleapis.com)
#    - IAM Credentials API (iamcredentials.googleapis.com)
#
#    You can learn more about enabling APIs at
#    https://support.google.com/googleapi/answer/6158841.
#
# 2. Create and configure a Workload Identity Provider for GitHub:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation.
#
#    Depending on how you authenticate, you will need to grant an IAM principal
#    permissions on Google Cloud:
#
#    - Artifact Registry Administrator (roles/artifactregistry.admin)
#    - Cloud Run Source Developer (roles/run.sourceDeveloper)
#
#    You can learn more about setting IAM permissions at
#    https://cloud.google.com/iam/docs/manage-access-other-resources.
#
# 3. Change the values in the "env" block to match your values.

name: 'Deploy to Cloud Run from Source'

on:
  push:
    branches:
      - "main" # Removed the extra set of quotes for standard YAML syntax

env:
  PROJECT_ID: 'nyc-eviction-updates' # Updated from your main.py configuration
  REGION: 'us-east1'               # Recommended for NYC-based projects/data
  SERVICE: 'nyc-eviction-pipeline' # A descriptive name for your Cloud Run service

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          # Note: You will need to create this Workload Identity Pool in GCP
          # replacing '123456789' with your actual Project Number
          workload_identity_provider: 'projects/nyc-eviction-updates/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: '609187627717-compute@developer.gserviceaccount.com'
        
      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          source: './'
          # Since your main.py uses a function signature (event, context),
          # ensure your Cloud Run service is configured to handle the request.

      - name: 'Show output'
        run: |-
          echo ${{ steps.deploy.outputs.url }}
